<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrollwork: animate, inView, scroll</title>
  <style>
    body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #16160f; background: #fffff7; }
    .progress { position: fixed; inset: 0 0 auto 0; height: 4px; background: #6c4dff; transform-origin: 0 50%; scale: 0 1; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 60vh 24px; }
    .tile { width: 160px; height: 160px; border-radius: 16px; background: #16160f; }
    @media (prefers-color-scheme: dark) { body { color: #f2f2ea; background: #16160f; } .tile { background: #f2f2ea; } }
  </style>
</head>
<body>
  <div class="progress"></div>
  <div class="grid">
    <div class="tile"></div><div class="tile"></div><div class="tile"></div>
    <div class="tile"></div><div class="tile"></div><div class="tile"></div>
  </div>
  <!-- After `npm run build`; or use https://cdn.jsdelivr.net/npm/scrollwork@1/dist/scrollwork.min.js -->
  <script src="../dist/scrollwork.min.js"></script>
  <script>
    const { animate, inView, scroll } = Scrollwork;
    // the bar follows the page
    scroll((p) => { document.querySelector('.progress').style.scale = p + ' 1'; });
    // the tiles rise as they arrive, one after another, and sink when they leave
    inView('.grid', () => {
      const a = animate('.tile', { y: [60, 0], opacity: [0, 1], rotate: [-6, 0] }, { duration: 0.7, stagger: 0.08, ease: 'expo' });
      return () => a.reverse();
    }, { amount: 0.3 });
  </script>
</body>
</html>
